      #   optional_features:
      #     TriggerCacheEnable: false
      #     OverlapMode: "On"
      #     ExposureTimeMode: Standard
      #     HDREnable: false
      #     FullFrameTransmission: false
      - id: camera_4
        serial_number: "DB2239179"
        frame_number_base: 1
        features:
          ExposureMode: Timed
          AutoExposureTimeUpperLimit: 10000
          AutoExposureTimeLowerLimit: 26
          ExposureAuto: Continuous
        optional_features:
