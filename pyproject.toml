[project]
name = "integrated-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
 requires-python = ">=3.10,<3.11"
dependencies = [
    "asyncpg>=0.29",
    "boto3>=1.34",
    "fastapi>=0.110",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "sahi==0.12.6",
    "pydantic>=2.0",
    "pyserial>=3.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
   
    "torch==2.8.0",
    "torchvision==0.23.0",
    "ultralytics==8.4.0",
    "uvicorn>=0.27",
    "websockets>=12.0",
]

[tool.uv]
override-dependencies = [
      "opencv-python==4.11.0.86",
  ]
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "jetson-cu126"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "jetson-cu126" }
torchvision = { index = "jetson-cu126" }